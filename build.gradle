plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'git.artdeell.cubixuishim'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.cubix.launcher"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 33
        versionName "1.1-"+new Date().format('yyyyMMdd')
    }

    buildTypes {
        release {
            applicationIdSuffix ".rel"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        gplay {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(":app_pojavlauncher")
    implementation project(":cubix-ui-shim:cubix-proprietary")
    implementation 'androidx.preference:preference:1.1.1'
    implementation fileTree(dir: '../app_pojavlauncher/libs', include: ['*.jar'])
    implementation files("../app_pojavlauncher/libs/ltw-release.aar")
}